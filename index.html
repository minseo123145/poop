<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이정원 키 키우기</title>
<style>
:root{--bg:#eaf6ff;--card:#fff;--tx:#1d2b3a;--sub:#5b6b7b;--ac:#ff7a45;--line:#cfe3f2;--sky:#bfe4ff;--grass:#8fd694;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101922;--card:#1b2733;--tx:#eaf2f8;--sub:#9fb2c3;--line:#2c3e4f;--sky:#1f3a52;--grass:#2f6a3b}}
:root[data-theme="dark"]{--bg:#101922;--card:#1b2733;--tx:#eaf2f8;--sub:#9fb2c3;--line:#2c3e4f;--sky:#1f3a52;--grass:#2f6a3b}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:520px;padding:16px}
h1{font-size:22px;margin:4px 0 2px;text-align:center}
.sub{text-align:center;color:var(--sub);font-size:13px;margin-bottom:12px}
.stats{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--sub)}
.title{text-align:center;font-weight:700;color:var(--ac);min-height:24px;margin-bottom:8px}
.stage{position:relative;height:340px;background:linear-gradient(var(--sky),var(--bg));border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ground{position:absolute;left:0;right:0;bottom:0;height:14px;background:var(--grass)}
.ruler{position:absolute;left:0;top:0;bottom:14px;width:60px}
.tick{position:absolute;left:0;width:100%;border-top:1px dashed var(--line);font-size:11px;color:var(--sub);padding-left:4px;line-height:1}
.char{position:absolute;bottom:14px;left:50%;transform:translateX(-30%);transition:height .15s ease-out}
.char svg{display:block;height:100%;width:auto}
.char.pop{animation:pop .15s}
@keyframes pop{50%{filter:brightness(1.15)}}
.float{position:absolute;left:55%;font-weight:800;color:var(--ac);pointer-events:none;animation:up .8s forwards;font-size:18px}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
.btn{width:100%;margin-top:12px;padding:16px;font-size:20px;font-weight:800;border:0;border-radius:14px;background:var(--ac);color:#fff;cursor:pointer;box-shadow:0 5px 0 #c9541f;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c9541f}
.shop{margin-top:12px;display:grid;gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.item small{display:block;color:var(--sub)}
.item button{border:0;border-radius:10px;padding:8px 12px;background:#2f9e6b;color:#fff;font-weight:700;cursor:pointer}
.item button:disabled{background:var(--line);color:var(--sub);cursor:not-allowed}
.reset{display:block;margin:14px auto 0;background:none;border:0;color:var(--sub);text-decoration:underline;cursor:pointer;font-size:12px}
</style>
</head>
<body>
<div class="app">
  <h1>📏 이정원 키 키우기</h1>
  <div class="sub">버튼을 눌러 정원이의 키를 쑥쑥 키워주세요!</div>
  <div class="stats">
    <div class="stat"><b id="h">150.0</b><span>현재 키 (cm)</span></div>
    <div class="stat"><b id="pc">1</b><span>클릭당 +cm</span></div>
    <div class="stat"><b id="ps">0</b><span>초당 +cm</span></div>
  </div>
  <div class="title" id="title"></div>
  <div class="stage" id="stage">
    <div class="ruler" id="ruler"></div>
    <div class="char" id="char">
      <svg viewBox="0 0 60 120" xmlns="http://www.w3.org/2000/svg">
        <path d="M16 30 Q8 50 12 70" stroke="#f1c6a0" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M44 30 Q52 50 48 70" stroke="#f1c6a0" stroke-width="5" fill="none" stroke-linecap="round"/>
        <rect x="23" y="70" width="6" height="46" rx="3" fill="#3b4a72"/>
        <rect x="31" y="70" width="6" height="46" rx="3" fill="#3b4a72"/>
        <rect x="21" y="113" width="10" height="6" rx="3" fill="#222"/>
        <rect x="29" y="113" width="10" height="6" rx="3" fill="#222"/>
        <rect x="16" y="28" width="28" height="44" rx="8" fill="#ff7a45"/>
        <text x="30" y="55" font-size="8" font-weight="800" text-anchor="middle" fill="#fff" font-family="sans-serif">정원</text>
        <circle cx="30" cy="16" r="14" fill="#f8d7b5"/>
        <path d="M16 14 Q18 1 30 2 Q42 1 44 14 Q36 7 16 14Z" fill="#2b2118"/>
        <circle cx="25" cy="17" r="1.8" fill="#222"/>
        <circle cx="35" cy="17" r="1.8" fill="#222"/>
        <path d="M25 22 Q30 26 35 22" stroke="#222" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <circle cx="21" cy="21" r="2.2" fill="#ffb3a0" opacity=".7"/>
        <circle cx="39" cy="21" r="2.2" fill="#ffb3a0" opacity=".7"/>
      </svg>
    </div>
    <div class="ground"></div>
  </div>
  <button class="btn" id="grow">🥛 키 키우기!</button>
  <div class="shop" id="shop"></div>
  <button class="reset" id="reset">처음부터 다시 하기</button>
</div>
<script>
(function(){
  var START=150, h=START, pc=1, ps=0, shopLv={};
  var items=[
    {id:'milk',name:'🥛 우유 한 잔',desc:'클릭당 +1cm',base:20,mul:1.5,apply:function(){pc+=1}},
    {id:'stretch',name:'🧘 스트레칭 교실',desc:'초당 +1cm',base:50,mul:1.6,apply:function(){ps+=1}},
    {id:'vit',name:'💊 성장 영양제',desc:'클릭당 +10cm',base:300,mul:1.7,apply:function(){pc+=10}},
    {id:'tree',name:'🌱 마법의 콩나무',desc:'초당 +20cm',base:1000,mul:1.8,apply:function(){ps+=20}},
    {id:'giant',name:'🧙 거인의 비법',desc:'클릭당 +200cm',base:8000,mul:1.9,apply:function(){pc+=200}}
  ];
  var titles=[[150,'평범한 정원이'],[170,'평균 키 돌파! 🙂'],[185,'농구 선수 급 🏀'],[220,'세계 최장신 도전 😮'],[300,'기린과 눈높이 맞춤 🦒'],[600,'2층 집보다 커요 🏠'],[2000,'빌딩 숲의 거인 🏙️'],[10000,'구름 위로 쑥 ☁️'],[100000,'성층권 돌파 🚀'],[1000000,'우주 거인 이정원 🌌']];
  var $=function(i){return document.getElementById(i)};
  var charEl=$('char'),stage=$('stage'),ruler=$('ruler');

  function fmt(n){
    if(n>=1e5) return (n/100).toLocaleString('ko-KR',{maximumFractionDigits:0})+' m';
    return n.toLocaleString('ko-KR',{minimumFractionDigits:1,maximumFractionDigits:1});
  }
  function cost(it){var l=shopLv[it.id]||0;return Math.floor(it.base*Math.pow(it.mul,l))}
  function nice(v){var p=Math.pow(10,Math.floor(Math.log10(v)));var m=v/p;return (m<2?1:m<5?2:5)*p}
  function drawRuler(view){
    var step=nice(view/5),html='';
    for(var v=step;v<view;v+=step){
      var y=v/view*100;
      html+='<div class="tick" style="bottom:calc('+y+'% * (326/340))">'+(v>=100000?(v/100000)+'km':v>=100?(v/100)+'m':v+'cm')+'</div>';
    }
    ruler.innerHTML=html;
  }
  function render(){
    var view=Math.max(220,h*1.2);
    var px=Math.max(30,h/view*(stage.clientHeight-14));
    charEl.style.height=px+'px';
    $('h').textContent=fmt(h);
    $('pc').textContent=pc.toLocaleString('ko-KR');
    $('ps').textContent=ps.toLocaleString('ko-KR');
    var t=titles[0][1];
    for(var i=0;i<titles.length;i++) if(h>=titles[i][0]) t=titles[i][1];
    $('title').textContent=t;
    drawRuler(view);
    items.forEach(function(it){
      var b=document.getElementById('b_'+it.id);
      b.disabled=h-START<cost(it);
      document.getElementById('c_'+it.id).textContent=cost(it).toLocaleString('ko-KR')+'cm';
      document.getElementById('l_'+it.id).textContent=(shopLv[it.id]||0);
    });
  }
  function buildShop(){
    var s=$('shop');s.innerHTML='';
    items.forEach(function(it){
      var d=document.createElement('div');d.className='item';
      d.innerHTML='<div><b>'+it.name+'</b> <small>Lv.<span id="l_'+it.id+'">0</span> · '+it.desc+'</small></div><button id="b_'+it.id+'">구매 <span id="c_'+it.id+'"></span></button>';
      s.appendChild(d);
      d.querySelector('button').onclick=function(){
        var c=cost(it);
        if(h-START>=c){h-=c;shopLv[it.id]=(shopLv[it.id]||0)+1;it.apply();render()}
      };
    });
  }
  function pop(txt){
    var f=document.createElement('div');f.className='float';f.textContent=txt;
    f.style.left=(45+Math.random()*20)+'%';f.style.bottom=(charEl.clientHeight+20)+'px';
    if(parseFloat(f.style.bottom)>stage.clientHeight-30)f.style.bottom=(stage.clientHeight-40)+'px';
    stage.appendChild(f);setTimeout(function(){f.remove()},800);
  }
  $('grow').onclick=function(){
    h+=pc;pop('+'+pc+'cm');
    charEl.classList.remove('pop');void charEl.offsetWidth;charEl.classList.add('pop');
    render();
  };
  setInterval(function(){if(ps>0){h+=ps/10;render()}},100);
  $('reset').onclick=function(){h=START;pc=1;ps=0;shopLv={};render()};
  window.addEventListener('resize',render);
  buildShop();render();
})();
</script>
</body>
</html>
